<!DOCTYPE html>
<html lang="ja" style="background:#121212">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="白髪判定">
    <title>白髪トラッカー</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="./app.css">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
        }
    </script>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0;">白髪トラッカー</h2>
    
    <label class="btn">
        📷 今日の状態を判定
        <input type="file" accept="image/*" id="camera-input" aria-label="髪の写真を選んで今日の状態を判定">
    </label>

    <div class="tips-toggle" id="tips-toggle" role="button" tabindex="0" aria-expanded="false">
        <span>💡 より正確に解析するためのコツ</span>
        <span class="icon">▼</span>
    </div>
    <div class="tips-content" id="tips-content" aria-hidden="true">
        <div class="tips-inner">
            <strong>照明の条件</strong>
            <ul>
                <li><strong>明るさ：</strong>自然光や室内灯で十分に明るい場所で撮影</li>
                <li><strong>均一な光：</strong>影ができないよう、正面から光が当たるように</li>
                <li><strong>逆光を避ける：</strong>窓やライトを背にしない</li>
                <li><strong>蛍光灯より自然光：</strong>色味が自然になり、白髪の判定が正確に</li>
            </ul>
            <strong>撮影のコツ</strong>
            <ul>
                <li><strong>髪を広げる：</strong>分け目や全体が分かるように</li>
                <li><strong>画面中央に髪を配置：</strong>解析は中央エリアのみを使用します</li>
                <li><strong>距離を一定に：</strong>毎回同じ距離で撮ると推移が正確に</li>
                <li><strong>背景はシンプルに：</strong>髪以外の白い部分が写り込まないように</li>
            </ul>
        </div>
    </div>

    <div id="loading" class="loading">解析中...</div>

    <div id="result-display" style="display:none;" class="card">
        <div style="font-size: 0.9rem; color: #aaa;">最新の白髪率</div>
        <div class="result-area"><span id="ratio">0</span>%</div>
        <p id="advice" style="font-size: 0.9rem;"></p>
    </div>

    <div class="card">
        <div style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px;">推移グラフ</div>
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
        </div>
        <button type="button" onclick="clearData()" style="background:none; border:none; color:#666; font-size:0.7rem; margin-top:10px;">履歴をリセット</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1" defer></script>
<script src="./app.js" defer></script>

</body>
</html>
